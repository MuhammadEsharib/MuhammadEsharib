name: Profile metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: MuhammadEsharib
          filename: metrics/isocalendar.svg
          base: ""
          template: classic
          config_output: svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Generate language overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: MuhammadEsharib
          filename: metrics/languages.svg
          base: ""
          template: classic
          config_output: svg
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 0%

      - name: Generate selected repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: MuhammadEsharib
          filename: metrics/repositories.svg
          base: ""
          template: classic
          config_output: svg
          plugin_repositories: yes
          plugin_repositories_featured: Portfolio,Robin-Travels,AEHTER,applyflow
          plugin_repositories_order: featured
