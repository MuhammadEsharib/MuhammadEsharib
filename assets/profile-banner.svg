  <circle cx="1038" cy="105" r="3" fill="#9ed9ba"/>
  <circle cx="805" cy="235" r="2.5" fill="#9ed9ba"/>
  <circle cx="1064" cy="237" r="2" fill="#d2eee0" fill-opacity=".8"/>

  <text x="1080" y="318" fill="#708a7e" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="end" letter-spacing="2">SOFTWARE · SECURITY · DESIGN</text>
