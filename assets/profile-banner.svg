<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Esharib | Computer Science Student, Web Developer and Aspiring Cybersecurity Analyst</title>
  <desc id="desc">A restrained dark graphite banner with a fine technical grid, soft green lighting and a precise wireframe sphere.</desc>
  <defs>
